<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Hexagon -->
  <polygon points="20,2 35,11 35,29 20,38 5,29 5,11"
    fill="url(#hexGrad)"
    stroke="rgba(34,197,94,0.5)"
    stroke-width="0.8"
    filter="url(#glow)"/>
  <!-- Leaf body -->
  <path d="M20 10 C20 10 13 17 13 23 C13 27.5 16 30.5 20 30.5 C24 30.5 27 27.5 27 23 C27 17 20 10 20 10Z"
    fill="url(#leafGrad)" opacity="0.95"/>
  <!-- Leaf vein center -->
  <line x1="20" y1="30.5" x2="20" y2="33" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left vein -->
  <path d="M20 22 C17.5 20 15 20.5 14.5 21" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Right vein -->
  <path d="M20 24 C22.5 22 25 22.5 25.5 23" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
</svg>
