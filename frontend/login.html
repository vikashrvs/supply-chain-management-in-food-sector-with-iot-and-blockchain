<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodChain — Login & Verification Portal</title>
    <meta name="description" content="FoodChain food safety and supply chain portal. Trace products via QR or log in to the enterprise blockchain dashboard.">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/glassmorphism.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sage: #5f8f72;
            --sage-dark: #315f46;
            --sage-soft: rgba(95, 143, 114, 0.14);
            --moss: #879b63;
            --amber: #c69c52;
            --amber-soft: rgba(198, 156, 82, 0.15);
            --line: rgba(255, 255, 255, 0.12);
        }

        [data-theme="light"] {
            --line: rgba(49, 95, 70, 0.15);
        }

        body {
            min-height: 100vh;
            font-family: var(--font-main, 'Inter', sans-serif);
            color: var(--text-body);
            background: radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.05), transparent 60%), #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden; /* Prevent scrolling, keep it app-like */
            transition: background 0.35s ease, color 0.35s ease;
        }

        /* ?? SPLIT LAYOUT ?? */
        .split-layout {
            display: flex;
            height: 85vh;
            min-height: 650px;
            max-height: 900px;
            width: 100%;
            max-width: 1100px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* LEFT SIDE: BRANDING */
        .split-brand {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            overflow: hidden;
            background: #0f172a;
            color: #ffffff;
        }
        
        .split-brand::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(34, 197, 94, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.15), transparent 50%);
            z-index: 1;
        }

        /* Abstract Node Graphic instead of text */
        .abstract-nodes {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.3;
            background: radial-gradient(circle at 30% 30%, rgba(34, 197, 94, 0.12), transparent 45%),
                        radial-gradient(circle at 75% 70%, rgba(59, 130, 246, 0.1), transparent 42%);
        }

        .abstract-nodes svg {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: floatSlow 20s ease-in-out infinite alternate;
        }

        @keyframes floatSlow {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-20px) scale(1.05); }
        }

        .brand-content {
            position: relative;
            z-index: 10;
            max-width: 480px;
        }

        .logo-svg {
            width: 100px;
            height: 100px;
            color: #22c55e;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.4));
        }

        .split-brand h1 {
            font-family: var(--font-heading, 'Inter', sans-serif);
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .split-brand p {
            font-size: 18px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
        }

        .trust-badges {
            display: flex;
            gap: 20px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trust-badges i {
            margin-right: 6px;
            color: #22c55e;
        }

        /* RIGHT SIDE: FORM */
        .split-form {
            width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--card-border);
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: -15px 0 40px rgba(0,0,0,0.15);
        }

        .theme-toggle-container {
            display: flex;
            justify-content: flex-end;
            padding: 24px 32px;
        }

        .theme-toggle-btn {
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid var(--card-border);
            background: transparent;
            cursor: pointer; color: var(--text-heading);
            font-size: 16px; 
            transition: transform 0.25s ease, background 0.25s ease;
        }
        .theme-toggle-btn:hover { background: var(--input-bg); transform: scale(1.05); }

        .form-container {
            flex: 1;
            padding: 0 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        /* Form inner styles from original */
        .form-header { margin-bottom: 24px; }
        .form-header h2 { font-size: 24px; font-weight: 700; color: var(--text-heading); margin-bottom: 4px;}
        .form-header p { font-size: 14px; color: var(--text-muted); }

        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            background: var(--input-bg);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--card-border);
        }
        .tab-btn {
            flex: 1; min-height: 44px; border: none; background: transparent;
            color: var(--text-muted); font-family: var(--font-heading, sans-serif);
            font-size: 14px; font-weight: 600; cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-heading);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .panel { display: none; animation: fadeIn 0.3s ease both; }
        .panel.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .field-label {
            font-size: 13px; font-weight: 600; color: var(--text-heading);
            display: flex; align-items: center; justify-content: space-between;
        }
        .field-label span { font-weight: 400; font-size: 11px; color: var(--text-muted); }
        .input-wrap { position: relative; }
        .form-input {
            width: 100%; height: 48px; padding: 0 16px 0 42px;
            background: var(--input-bg); border: 1.5px solid var(--input-border);
            border-radius: 10px; font-size: 14px; color: var(--text-heading);
            font-family: inherit; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input::placeholder { color: var(--text-muted); }
        .form-input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 14px; pointer-events: none;
        }
        .pw-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); font-size: 14px;
            cursor: pointer; transition: color 0.2s;
        }
        .pw-toggle:hover { color: var(--text-heading); }

        .tip-text { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }

        .btn-primary {
            width: 100%; height: 48px;
            background: #22c55e;
            color: #ffffff; border: none; border-radius: 10px;
            font-family: inherit; font-size: 15px; font-weight: 600;
            cursor: pointer; box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { background: #16a34a; transform: translateY(-1px); }
        
        .btn-secondary {
            width: 100%; height: 44px; margin-top: 12px;
            background: transparent; border: 1px solid var(--input-border);
            color: var(--text-heading); border-radius: 10px;
            font-family: inherit; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-secondary:hover { background: var(--input-bg); border-color: var(--card-border); }

        .role-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
        .role-btn {
            padding: 10px 4px; border: 1.5px solid var(--input-border);
            border-radius: 10px; background: var(--input-bg);
            color: var(--text-muted); font-family: inherit;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .role-btn i { font-size: 16px; }
        .role-btn:hover { border-color: rgba(34,197,94,0.4); color: var(--text-heading); }
        .role-btn.active {
            border-color: #22c55e; background: rgba(34,197,94,0.1);
            color: #22c55e;
        }
        [data-theme="dark"] .role-btn.active { color: #4ade80; }

        /* Scanner */
        .scanner-box {
            display: none; margin-top: 16px; padding: 12px;
            border: 1px solid var(--card-border); border-radius: 12px;
            background: var(--input-bg);
        }
        .scanner-box.active { display: block; }
        .scanner-viewport {
            position: relative; height: 160px; overflow: hidden;
            border-radius: 8px; background: #0f172a;
        }
        .scanner-viewport video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-laser {
            position: absolute; left: 20px; right: 20px; top: 20px; height: 2px;
            background: #22c55e;
            animation: laserScan 1.8s ease-in-out infinite;
        }
        @keyframes laserScan { 0%,100% { transform: translateY(0); } 50% { transform: translateY(115px); } }
        .scanner-status { font-size: 12px; color: var(--text-muted); margin-top: 8px; text-align: center; }

        .alert-box {
            margin-top: 16px; padding: 12px 16px; border-radius: 10px;
            font-size: 13px; font-weight: 600; display: none; align-items: center; gap: 10px;
        }
        .alert-box.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #dc2626; display: flex; }
        .alert-box.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: #15803d; display: flex; }
        [data-theme="dark"] .alert-box.error { color: #f87171; }
        [data-theme="dark"] .alert-box.success { color: #4ade80; }

        .page-footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            pointer-events: none;
        }
        [data-theme="light"] .page-footer { color: rgba(0,0,0,0.4); }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            body { overflow: auto; padding: 0; background: var(--bg-page); display: block; }
            .split-layout { 
                flex-direction: column; height: auto; min-height: 100vh; 
                max-width: none; border-radius: 0; border: none; box-shadow: none;
            }
            .split-brand { padding: 40px 24px; min-height: 300px; flex: none; }
            .split-form { width: 100%; border-left: none; border-top: 1px solid var(--card-border); }
            .form-container { padding: 40px 24px; }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        
        <!-- LEFT: BRANDING & MEANINGFUL BACKGROUND -->
        <div class="split-brand">
            <div class="abstract-nodes">
                <svg viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Clean, modern node connections -->
                    <path d="M100 100 L300 250 L200 450 L500 350 L700 500 L650 200 L450 150 Z" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-linejoin="round"/>
                    <circle cx="100" cy="100" r="6" fill="#22c55e" opacity="0.8"/>
                    <circle cx="300" cy="250" r="8" fill="#3b82f6" opacity="0.8"/>
                    <circle cx="200" cy="450" r="5" fill="#ffffff" opacity="0.5"/>
                    <circle cx="500" cy="350" r="10" fill="#22c55e" opacity="0.8"/>
                    <circle cx="700" cy="500" r="6" fill="#ffffff" opacity="0.5"/>
                    <circle cx="650" cy="200" r="7" fill="#3b82f6" opacity="0.8"/>
                    <circle cx="450" cy="150" r="5" fill="#22c55e" opacity="0.8"/>
                </svg>
            </div>
            
            <div class="brand-content">
                <!-- Custom Logo Image -->
                <img src="images/logo.png" class="logo-svg" alt="FoodChain Logo" style="object-fit: contain;">
                
                <h1>FoodChain</h1>
                <p>Securing the global food supply chain with an Immutable Ledger and transparent IoT tracking from farm to fork.</p>
                
                <div class="trust-badges">
                    <span><i class="fa-brands fa-ethereum"></i> Blockchain Verified</span>
                    <span><i class="fa-solid fa-microchip"></i> IoT Enabled</span>
                </div>
            </div>
        </div>

        <!-- RIGHT: AUTH FORM -->
        <div class="split-form">
            <div class="theme-toggle-container">
                <button class="theme-toggle-btn" id="theme-toggle" type="button" onclick="toggleTheme()" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
            
            <div class="form-container">
                <div class="form-header">
                    <h2>Welcome back</h2>
                    <p>Enter your details to access the portal.</p>
                </div>

                <section class="panel active" id="panel-enterprise">
                    <div class="field-group">
                        <label class="field-label">Staff Role</label>
                        <div class="role-grid">
                            <button class="role-btn active" type="button" onclick="selectRole(this, 'admin')">
                                <i class="fa-solid fa-shield-halved"></i> Admin
                            </button>
                            <button class="role-btn" type="button" onclick="selectRole(this, 'producer')">
                                <i class="fa-solid fa-seedling"></i> Producer
                            </button>
                            <button class="role-btn" type="button" onclick="selectRole(this, 'distributor')">
                                <i class="fa-solid fa-store"></i> Distributor
                            </button>
                            <button class="role-btn" type="button" onclick="selectRole(this, 'business')">
                                <i class="fa-solid fa-chart-line"></i> Business
                            </button>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="username">Username</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input id="username" class="form-input" type="text" placeholder="Enter username" autocomplete="username">
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="password">Password</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input id="password" class="form-input" type="password" placeholder="Enter password" autocomplete="current-password">
                            <button class="pw-toggle" type="button" onclick="togglePassword()">
                                <i class="fa-regular fa-eye" id="pw-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button class="btn-primary" type="button" onclick="handleEnterpriseLogin()">
                        Login to Dashboard
                    </button>

                    <div class="alert-box" id="enterprise-alert"></div>
                </section>
            </div>
        </div>
    </div>

    <footer class="page-footer">
        Copyright &copy; 2026 FoodChain. All rights reserved.
    </footer>

    <script src="js/auth.js"></script>
    <script>
        let selectedRole = 'admin';
        let pwVisible = false;
        let scannerStream = null;
        let scannerTimer = null;

        const requestedRole = new URLSearchParams(window.location.search).get('role');
        if (['admin', 'producer', 'distributor', 'business'].includes(requestedRole)) {
            selectedRole = requestedRole;
            document.querySelectorAll('.role-btn').forEach((button) => {
                button.classList.toggle('active', button.getAttribute('onclick')?.includes(`'${requestedRole}'`));
            });
        }

        function selectRole(btn, role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function togglePassword() {
            pwVisible = !pwVisible;
            const input = document.getElementById('password');
            const icon  = document.getElementById('pw-icon');
            input.type = pwVisible ? 'text' : 'password';
            icon.className = pwVisible ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        }

        async function handleEnterpriseLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('enterprise-alert');
            alertBox.style.display = 'none';

            if (!username || !password) {
                alertBox.textContent = 'Please enter both username and password.';
                alertBox.className = 'alert-box error';
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.detail || 'Invalid credentials. Please try again.');
                }

                const data = await res.json();
                setSession(data.access_token, data.role || selectedRole, data.username || username);
                alertBox.textContent = 'Login successful! Redirecting...';
                alertBox.className = 'alert-box success';
                setTimeout(() => { redirectByRole(); }, 500);

            } catch (err) {
                alertBox.textContent = err.message || 'Invalid username or password.';
                alertBox.className = 'alert-box error';
            }
        }


        /* ?? CAMERA QR SCANNER ?? */
        async function toggleScanner() {
            const box = document.getElementById('scanner-box');
            if (box.classList.contains('active')) {
                stopScanner();
                return;
            }
            box.classList.add('active');
            await startScanner();
        }

        async function startScanner() {
            const status = document.getElementById('scanner-status');
            const video = document.getElementById('scanner-video');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                status.textContent = 'Camera access is not available in this browser environment. Enter tracking ID manually.';
                return;
            }

            try {
                scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = scannerStream;
                await video.play();
                status.textContent = 'Scanning for QR code... Point camera at label.';

                if ('BarcodeDetector' in window) {
                    const detector = new BarcodeDetector({ formats: ['qr_code'] });
                    scannerTimer = window.setInterval(async () => {
                        try {
                            const codes = await detector.detect(video);
                            if (codes.length) {
                                const val = codes[0].rawValue || '';
                                document.getElementById('tracking-id').value = val;
                                status.textContent = `? QR Code detected: ${val}`;
                                stopScanner(false);
                            }
                        } catch(e) {}
                    }, 600);
                } else {
                    status.textContent = 'Camera active. Point at QR label or enter ID manually.';
                }
            } catch (err) {
                status.textContent = 'Camera permission blocked or unavailable. Enter tracking ID manually.';
            }
        }

        function stopScanner(hide = true) {
            if (scannerTimer) { clearInterval(scannerTimer); scannerTimer = null; }
            if (scannerStream) { scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
            const video = document.getElementById('scanner-video');
            if (video) video.srcObject = null;
            if (hide) document.getElementById('scanner-box').classList.remove('active');
        }

        /* ?? THEME TOGGLE ?? */
        const html = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        function applyTheme(t) {
            html.setAttribute('data-theme', t);
            themeBtn.innerHTML = t === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
            localStorage.setItem('ag-theme', t);
        }
        function toggleTheme() {
            applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
        applyTheme(localStorage.getItem('ag-theme') || 'dark');

        /* ?? ENTER KEY SHORTCUT ?? */
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                handleEnterpriseLogin();
            }
        });
    </script>
</body>
</html>
