<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodChain — Secure Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap');

        :root {
            --bg: #f0f2f5;
            --panel: #ffffff;
            --accent: #1f3b5b;
            --accent-light: #334e68;
            --accent-glow: rgba(31, 59, 91, 0.08);
            --line: #d0d8e0;
            --text: #0f172a;
            --muted: #64748b;
            --success: #15803d;
            --warning: #b45309;
            --critical: #dc2626;
            --shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.1);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #60a5fa;
            --accent-light: #93c5fd;
            --accent-glow: rgba(96, 165, 250, 0.08);
            --line: #334155;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Background effect */
        .bg-blob {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        .bg-blob-1 {
            top: -200px;
            left: -200px;
            background: linear-gradient(135deg, var(--accent), transparent);
        }

        .bg-blob-2 {
            bottom: -200px;
            right: -200px;
            background: linear-gradient(135deg, transparent, var(--accent));
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 440px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 48px;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .login-card.shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 16px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .logo h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* Role selector */
        .role-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .role-btn {
            padding: 14px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .role-btn.active, .role-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        /* Floating inputs */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 16px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            color: var(--text);
            font-size: 15px;
            transition: all 0.25s;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .input-group label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
            transition: all 0.25s ease;
            background: var(--panel);
            padding: 0 4px;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 11px;
            color: var(--accent);
            font-weight: 600;
        }

        /* Password strength */
        .strength-meter {
            height: 4px;
            background: var(--line);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .strength-meter.show { display: block; }

        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .strength-fill.weak { width: 33%; background: var(--critical); }
        .strength-fill.medium { width: 66%; background: var(--warning); }
        .strength-fill.strong { width: 100%; background: var(--success); }

        .strength-text {
            font-size: 11px;
            margin-top: 4px;
            text-align: right;
            display: none;
        }

        /* Submit */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 24px var(--accent-glow);
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px var(--accent-glow);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Error toast */
        .error-msg {
            color: var(--critical);
            font-size: 13px;
            text-align: center;
            margin-top: 16px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error-msg.show { opacity: 1; }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            color: var(--muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        /* Theme toggle */
        .theme-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--panel);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 10;
            transition: all 0.3s;
        }

        .theme-btn:hover { transform: rotate(15deg); }

        /* Responsive */
        @media (max-width: 520px) {
            .login-card { width: 90%; padding: 32px 24px; }
            .role-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <button class="theme-btn" onclick="toggleTheme()">🌓</button>

    <div class="login-card" id="loginCard">
        <div class="logo">
            <div class="logo-icon">⛓</div>
            <h1>FOODCHAIN</h1>
            <p>Supply Chain Authentication</p>
        </div>

        <div class="role-grid">
            <button class="role-btn active" data-role="admin" onclick="setRole(this)">👤 Admin</button>
            <button class="role-btn" data-role="farmer" onclick="setRole(this)">🌾 Farmer</button>
            <button class="role-btn" data-role="retailer" onclick="setRole(this)">🏪 Retailer</button>
            <button class="role-btn" data-role="consumer" onclick="setRole(this)">🛒 Consumer</button>
        </div>

        <div id="credentialFields">
            <div class="input-group">
                <input type="text" id="username" placeholder=" " required>
                <label for="username">Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required oninput="checkStrength(this.value)">
                <label for="password">Password</label>
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>
        </div>

        <div class="input-group" id="uidField" style="display: none;">
            <input type="text" id="productUid" placeholder=" " required>
            <label for="productUid">Enter UID from QR or Label</label>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="handleLogin()">ACCESS SYSTEM</button>
        <div class="error-msg" id="errorMsg">Invalid credentials. Try again.</div>

        <div class="footer">
            Secured by Blockchain & IoT.<br>
            <a href="#">Need help?</a>
        </div>
    </div>

    <script>
        let currentRole = 'admin';

        (function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', html.getAttribute('data-theme'));
        }

        function setRole(btn) {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRole = btn.dataset.role;

            const isConsumer = currentRole === 'consumer';
            document.getElementById('credentialFields').style.display = isConsumer ? 'none' : 'block';
            document.getElementById('uidField').style.display = isConsumer ? 'block' : 'none';
            document.getElementById('submitBtn').textContent = isConsumer ? 'TRACK PRODUCT' : 'ACCESS SYSTEM';
        }

        function checkStrength(value) {
            const meter = document.getElementById('strengthMeter');
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            if (!value) { meter.classList.remove('show'); text.style.display = 'none'; return; }

            meter.classList.add('show');
            text.style.display = 'block';

            let strength = 0;
            if (value.length >= 8) strength++;
            if (/[A-Z]/.test(value)) strength++;
            if (/[0-9]/.test(value)) strength++;
            if (/[^A-Za-z0-9]/.test(value)) strength++;

            fill.className = 'strength-fill';
            if (strength <= 1) { fill.classList.add('weak'); text.textContent = 'Weak'; text.style.color = 'var(--critical)'; }
            else if (strength === 2) { fill.classList.add('medium'); text.textContent = 'Medium'; text.style.color = 'var(--warning)'; }
            else { fill.classList.add('strong'); text.textContent = 'Strong'; text.style.color = 'var(--success)'; }
        }

        function handleLogin() {
            const card = document.getElementById('loginCard');
            const error = document.getElementById('errorMsg');

            if (currentRole === 'consumer') {
                const uid = document.getElementById('productUid').value;
                if (!uid) {
                    showError('Enter a product UID to track.');
                    return;
                }
                window.location.href = `track.html?uid=${encodeURIComponent(uid)}`;
                return;
            }

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // TODO: Move to backend authentication endpoint (e.g., POST /api/auth/login)
            // Current demo credentials — MUST be replaced with proper backend auth for production
            const creds = {
                admin: { u: 'admin', p: 'admin123' },
                farmer: { u: 'farmer', p: 'farmer123' },
                retailer: { u: 'retailer', p: 'retail123' }
            };

            const current = creds[currentRole];
            if (current && username === current.u && password === current.p) {
                localStorage.setItem('role', currentRole);
                window.location.href = 'home.html';
            } else {
                card.classList.add('shake');
                showError('Invalid credentials. Try again.');
                setTimeout(() => card.classList.remove('shake'), 500);
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        // Enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
